<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mercado</title>
<style>
  :root{
    --bg:#0f1512;
    --card:#1a221d;
    --ink:#f2f5f0;
    --sub:#8fa294;
    --line:#2a352e;
    --accent:#5fd487;
    --accent-dark:#173322;
    --danger:#ff8a7a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:32px 16px 80px;
    -webkit-tap-highlight-color:transparent;
  }
  .app{width:100%;max-width:480px;}
  h1{
    font-size:26px;
    font-weight:800;
    margin:0 0 4px;
    letter-spacing:-0.02em;
  }
  .sub{color:var(--sub);font-size:14px;margin:0 0 24px;}

  .session-bar{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px;
    margin-bottom:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .session-bar.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#08150d;
  }
  .session-info{display:flex;flex-direction:column;gap:3px;}
  .session-title{font-weight:700;font-size:16px;}
  .session-sub{font-size:13px;opacity:0.8;}
  button{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    border-radius:12px;
    border:none;
    padding:11px 18px;
    cursor:pointer;
  }
  .btn-start{background:var(--accent);color:#08150d;}
  .btn-start:active{opacity:0.85;transform:scale(0.98);}
  .btn-end{background:#08150d;color:var(--accent);}
  .btn-end:active{opacity:0.85;transform:scale(0.98);}

  .progress-track{
    height:6px;
    background:rgba(8,21,13,0.25);
    border-radius:4px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    background:#08150d;
    border-radius:4px;
    transition:width 0.2s ease;
  }

  .add-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    margin-bottom:22px;
  }
  .add-row{
    display:flex;
    gap:8px;
  }
  .add-row input[type=text]{
    flex:1;
    padding:13px 15px;
    border:1px solid var(--line);
    border-radius:12px;
    font-size:15px;
    background:var(--bg);
    color:var(--ink);
  }
  .add-row input[type=text]::placeholder{color:var(--sub);}
  .add-row input[type=text]:focus{
    outline:none;
    border-color:var(--accent);
  }
  .add-row button{background:var(--accent);color:#08150d;padding:0 20px;flex-shrink:0;}

  .cat-select{
    display:flex;
    gap:6px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .cat-chip{
    font-size:12.5px;
    font-weight:600;
    padding:7px 12px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--sub);
    cursor:pointer;
  }
  .cat-chip.selected{
    background:var(--accent);
    border-color:var(--accent);
    color:#08150d;
  }

  .section{margin-bottom:22px;}
  .section-header{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    padding:0 2px;
  }
  .section-title{
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--sub);
  }
  .section-count{
    font-size:12px;
    color:var(--sub);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:1px 8px;
  }

  ul{list-style:none;margin:0;padding:0;}
  li{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 15px;
    margin-bottom:8px;
  }
  li.checked{
    background:var(--accent-dark);
    border-color:var(--accent-dark);
  }
  .check{
    width:24px;height:24px;
    min-width:24px;
    border-radius:50%;
    border:2px solid var(--line);
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  li.checked .check{
    background:var(--accent);
    border-color:var(--accent);
  }
  .check svg{display:none;width:13px;height:13px;}
  li.checked .check svg{display:block;}
  .check.pop{animation:popCheck 0.32s ease;}
  @keyframes popCheck{
    0%{transform:scale(1);}
    35%{transform:scale(1.35);}
    60%{transform:scale(0.92);}
    100%{transform:scale(1);}
  }
  li{transition:background 0.25s ease, border-color 0.25s ease;}
  li.checked .item-text{transition:color 0.25s ease;}

  .item-text{
    flex:1;
    font-size:15.5px;
    word-break:break-word;
  }
  li.checked .item-text{
    color:var(--sub);
    text-decoration:line-through;
  }
  .remove{
    background:none;
    border:none;
    color:var(--sub);
    font-size:20px;
    padding:4px 6px;
    cursor:pointer;
    line-height:1;
  }
  .remove:active{color:var(--danger);}

  .empty{
    text-align:center;
    color:var(--sub);
    font-size:14px;
    padding:48px 0;
  }

  .hint{
    font-size:12.5px;
    color:var(--sub);
    text-align:center;
    margin-top:22px;
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="app">
  <h1>🛒 Mercado</h1>
  <p class="sub">Arma tu lista por secciones. Marca lo que vas comprando.</p>

  <div id="sessionBar" class="session-bar">
    <div class="session-info">
      <span id="sessionTitle" class="session-title">Sin comenzar</span>
      <span id="sessionSub" class="session-sub">Dale iniciar cuando estés en el súper</span>
      <div id="progressTrack" class="progress-track" style="display:none;">
        <div id="progressFill" class="progress-fill" style="width:0%;"></div>
      </div>
    </div>
    <button id="sessionBtn" class="btn-start">Iniciar</button>
  </div>

  <div class="add-card">
    <div class="add-row">
      <input type="text" id="newItem" placeholder="Ej: 3 plátanos" maxlength="80">
      <button id="addBtn">Añadir</button>
    </div>
    <div class="cat-select" id="catSelect"></div>
  </div>

  <div id="sections"></div>
  <div id="emptyState" class="empty" style="display:none;">Tu lista está vacía. Agrega algo arriba.</div>

  <p class="hint">Al finalizar se borran los chulos para que la lista quede lista para la próxima. Los productos y sus secciones se guardan siempre.</p>
</div>

<script>
const STORAGE_KEY = 'mercado-state-v2';
const CATEGORIES = ['Frutas y verduras', 'Carnes', 'Aseo personal', 'Varios'];
const DEFAULT_ITEMS = [
  { text: 'Plátanos verdes', category: 'Frutas y verduras' },
  { text: 'Cebollas rojas', category: 'Frutas y verduras' },
  { text: 'Aji', category: 'Frutas y verduras' },
  { text: 'Limones', category: 'Frutas y verduras' },
  { text: 'Aguacate', category: 'Frutas y verduras' },
  { text: 'Ajo', category: 'Frutas y verduras' },
  { text: 'Papaya', category: 'Frutas y verduras' },
  { text: 'Piña', category: 'Frutas y verduras' },
  { text: 'Bolsas de fresas', category: 'Frutas y verduras' },
  { text: 'Zanahorias', category: 'Frutas y verduras' },
  { text: 'Tomates', category: 'Frutas y verduras' },
  { text: 'Plátanos amarillos', category: 'Frutas y verduras' },
  { text: 'Manzanas verdes', category: 'Frutas y verduras' },
  { text: 'Pepinos', category: 'Frutas y verduras' },
  { text: 'Arándanos', category: 'Frutas y verduras' },
  { text: 'Bananas', category: 'Frutas y verduras' },
  { text: 'Cloro morado', category: 'Aseo personal' },
  { text: 'Lavaplatos', category: 'Aseo personal' },
  { text: 'Desodorantes', category: 'Aseo personal' },
  { text: 'Papel higiénico', category: 'Aseo personal' },
  { text: 'Avena', category: 'Varios' },
  { text: 'Huevos', category: 'Varios' },
  { text: 'Mantequilla', category: 'Varios' },
  { text: 'Aceite de oliva', category: 'Varios' },
  { text: 'Sal', category: 'Varios' },
  { text: 'Arroz', category: 'Varios' },
  { text: 'Pasta', category: 'Varios' },
  { text: 'Lentejas', category: 'Varios' },
  { text: 'Especias (ajo, orégano...)', category: 'Varios' },
  { text: 'Salsa de tomate', category: 'Varios' },
  { text: 'Canela', category: 'Varios' },
  { text: 'Cacao', category: 'Varios' }
];
let state = { items: [], shoppingActive: false };
let selectedCat = CATEGORIES[0];
let justToggled = null;

function uid(){
  return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function load(){
  let hadSavedData = false;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      state = JSON.parse(raw);
      hadSavedData = true;
    }
  }catch(e){
    // sin datos guardados, se usa el estado por defecto
  }
  if(!hadSavedData){
    state.items = DEFAULT_ITEMS.map(d => ({ id: uid(), text: d.text, checked: false, category: d.category }));
    save();
  }
  renderCatSelect();
  render();
}

function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('No se pudo guardar', e);
  }
}

function renderCatSelect(){
  const wrap = document.getElementById('catSelect');
  wrap.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const chip = document.createElement('div');
    chip.className = 'cat-chip' + (cat === selectedCat ? ' selected' : '');
    chip.textContent = cat;
    chip.onclick = () => {
      selectedCat = cat;
      renderCatSelect();
    };
    wrap.appendChild(chip);
  });
}

function render(){
  const sectionsEl = document.getElementById('sections');
  const empty = document.getElementById('emptyState');
  sectionsEl.innerHTML = '';

  if(state.items.length === 0){
    empty.style.display = 'block';
  }else{
    empty.style.display = 'none';
  }

  CATEGORIES.forEach(cat => {
    const catItems = state.items.filter(i => i.category === cat);
    if(catItems.length === 0) return;

    const section = document.createElement('div');
    section.className = 'section';

    const header = document.createElement('div');
    header.className = 'section-header';
    const title = document.createElement('span');
    title.className = 'section-title';
    title.textContent = cat;
    const count = document.createElement('span');
    count.className = 'section-count';
    const checkedCount = catItems.filter(i => i.checked).length;
    count.textContent = checkedCount + '/' + catItems.length;
    header.appendChild(title);
    header.appendChild(count);
    section.appendChild(header);

    const ul = document.createElement('ul');
    catItems.forEach(item => {
      const li = document.createElement('li');
      if(item.checked) li.classList.add('checked');

      const check = document.createElement('div');
      check.className = 'check' + (item.id === justToggled ? ' pop' : '');
      check.setAttribute('role','checkbox');
      check.setAttribute('aria-checked', item.checked ? 'true':'false');
      check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#08150d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      check.onclick = () => toggleItem(item.id);

      const text = document.createElement('span');
      text.className = 'item-text';
      text.textContent = item.text;

      const remove = document.createElement('button');
      remove.className = 'remove';
      remove.textContent = '×';
      remove.setAttribute('aria-label', 'Quitar ' + item.text);
      remove.onclick = () => removeItem(item.id);

      li.appendChild(check);
      li.appendChild(text);
      li.appendChild(remove);
      ul.appendChild(li);
    });
    section.appendChild(ul);
    sectionsEl.appendChild(section);
  });

  justToggled = null;
  renderSessionBar();
}

function renderSessionBar(){
  const bar = document.getElementById('sessionBar');
  const title = document.getElementById('sessionTitle');
  const sub = document.getElementById('sessionSub');
  const btn = document.getElementById('sessionBtn');
  const track = document.getElementById('progressTrack');
  const fill = document.getElementById('progressFill');

  const total = state.items.length;
  const checked = state.items.filter(i => i.checked).length;

  if(state.shoppingActive){
    bar.classList.add('active');
    title.textContent = 'Comprando ahora';
    sub.textContent = total ? checked + ' de ' + total + ' en el carrito' : 'Marca lo que vayas llevando';
    btn.textContent = 'Finalizar';
    btn.className = 'btn-end';
    track.style.display = 'block';
    fill.style.width = total ? Math.round((checked/total)*100) + '%' : '0%';
  }else{
    bar.classList.remove('active');
    title.textContent = 'Sin comenzar';
    sub.textContent = 'Dale iniciar cuando estés en el súper';
    btn.textContent = 'Iniciar';
    btn.className = 'btn-start';
    track.style.display = 'none';
  }
}

function toggleItem(id){
  const item = state.items.find(i => i.id === id);
  if(item) item.checked = !item.checked;
  justToggled = id;
  render();
  save();
}

function removeItem(id){
  state.items = state.items.filter(i => i.id !== id);
  render();
  save();
}

function addItem(){
  const input = document.getElementById('newItem');
  const val = input.value.trim();
  if(!val) return;
  state.items.push({ id: uid(), text: val, checked: false, category: selectedCat });
  input.value = '';
  render();
  save();
  input.focus();
}

function toggleSession(){
  if(state.shoppingActive){
    state.shoppingActive = false;
    state.items.forEach(i => i.checked = false);
  }else{
    state.shoppingActive = true;
  }
  render();
  save();
}

document.getElementById('addBtn').onclick = addItem;
document.getElementById('newItem').addEventListener('keydown', e => {
  if(e.key === 'Enter') addItem();
});
document.getElementById('sessionBtn').onclick = toggleSession;

load();
</script>
</body>
</html>
